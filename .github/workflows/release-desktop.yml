name: desktop-installers

# Builds the CLI and the Electron desktop installers entirely from this fork's
# sources, then attaches them to the matching GitHub release. Upstream
# release.yml is tied to anomalyco/opencode and needs signing keys, R2 and
# npm credentials, so this workflow runs the repository's own build scripts
# with only GITHUB_TOKEN.
#
# Each job compiles the CLI for its own platform into packages/cli/dist. The
# desktop build script (packages/desktop/script/build.ts) detects that output
# and embeds the locally built binary instead of downloading the published npm
# CLI package. The same binary is also published as a standalone CLI asset.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (default: v<package version>)"
        required: false
        type: string

permissions:
  contents: write

env:
  OPENCODE_CHANNEL: prod

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag and version
        id: resolve
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
          elif [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (source version $version)"

  linux-deb:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENCODE_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build CLI from source (linux-x64-baseline)
        working-directory: packages/cli
        env:
          OPENCODE_TARGET: linux-x64-baseline
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: bun ./script/build.ts --skip-install

      - name: Package standalone CLI (linux)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cli="packages/cli/dist/cli-linux-x64-baseline/bin/opencode"
          test -s "$cli" || { echo "::error::Compiled CLI missing: $cli"; exit 1; }
          mkdir -p dist/assets
          timeout 60 "$cli" --version || echo "::warning::CLI --version smoke check did not complete"
          tar -I 'gzip -1' -cf dist/assets/opencode-cli-linux-x64.tar.gz -C "$(dirname "$cli")" opencode
          pkg=$(mktemp -d)
          mkdir -p "$pkg/DEBIAN" "$pkg/usr/bin"
          cp "$cli" "$pkg/usr/bin/opencode"
          chmod 755 "$pkg/usr/bin/opencode"
          printf '%s\n' \
            "Package: opencode" \
            "Version: $VERSION" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Maintainer: fftchina" \
            "Description: opencode CLI built from source (automatic updates removed)" \
            > "$pkg/DEBIAN/control"
          dpkg-deb -Zgzip --build --root-owner-group "$pkg" dist/assets/opencode-cli-linux-amd64.deb
          rm -rf "$pkg"
          ls -lh dist/assets

      - name: Build desktop app
        working-directory: packages/desktop
        env:
          OPENCODE_TARGET: linux-x64
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: bun run build

      - name: Pack .deb
        working-directory: packages/desktop
        env:
          OPENCODE_TARGET: linux-x64
        shell: bash
        run: bun run pack

      - name: Collect assets, verify embedded CLI, checksums
        shell: bash
        run: |
          set -euo pipefail
          built=$(sha256sum packages/cli/dist/cli-linux-x64-baseline/bin/opencode | cut -d' ' -f1)
          embedded=$(sha256sum packages/desktop/resources/opencode-cli | cut -d' ' -f1)
          if [ "$built" != "$embedded" ]; then
            echo "::error::Desktop did not embed the locally compiled CLI (built=$built embedded=$embedded)"
            exit 1
          fi
          echo "Desktop embeds the source-built CLI: $built"
          cp dist/desktop/*.deb dist/assets/
          (cd dist/assets && sha256sum opencode-* > SHA256SUMS-linux)
          ls -lh dist/assets

      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # source-release creates the release and its changelog notes first;
          # wait for it instead of racing to create a bare release.
          for attempt in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "Waiting for release $TAG ($attempt/30)..."
            sleep 10
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "opencode $TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/assets/* --clobber

  windows-exe:
    needs: meta
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      OPENCODE_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build CLI from source (windows-x64-baseline)
        working-directory: packages/cli
        env:
          OPENCODE_TARGET: windows-x64-baseline
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: bun ./script/build.ts --skip-install

      - name: Stage standalone CLI (windows)
        shell: bash
        run: |
          set -euo pipefail
          cli="packages/cli/dist/cli-windows-x64-baseline/bin/opencode.exe"
          test -s "$cli" || { echo "::error::Compiled CLI missing: $cli"; exit 1; }
          mkdir -p dist/assets
          cp "$cli" dist/assets/opencode-cli-windows-x64.exe
          ls -lh dist/assets

      - name: Build desktop app
        working-directory: packages/desktop
        env:
          OPENCODE_TARGET: windows-x64
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: bun run build

      - name: Pack NSIS installer
        working-directory: packages/desktop
        env:
          OPENCODE_TARGET: windows-x64
        shell: bash
        run: |
          set -euo pipefail
          bunx electron-builder --win --x64 --publish never --config electron-builder.config.ts
          mkdir -p ../../dist/assets
          cp dist/*.exe ../../dist/assets/
          ls -lh ../../dist/assets

      - name: Verify embedded CLI, checksums and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          built=$(sha256sum packages/cli/dist/cli-windows-x64-baseline/bin/opencode.exe | cut -d' ' -f1)
          embedded=$(sha256sum packages/desktop/resources/opencode-cli.exe | cut -d' ' -f1)
          if [ "$built" != "$embedded" ]; then
            echo "::error::Desktop did not embed the locally compiled CLI (built=$built embedded=$embedded)"
            exit 1
          fi
          echo "Desktop embeds the source-built CLI: $built"
          (cd dist/assets && sha256sum *.exe > SHA256SUMS-windows)
          # source-release creates the release and its changelog notes first;
          # wait for it instead of racing to create a bare release.
          for attempt in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "Waiting for release $TAG ($attempt/30)..."
            sleep 10
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "opencode $TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/assets/* --clobber
